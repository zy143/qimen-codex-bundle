name: tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject sensitive tracked paths
        run: python scripts/check_sensitive_paths.py --tracked
      - name: Run engineering tests
        run: python -m unittest discover -s tests -p "test*.py" -v
